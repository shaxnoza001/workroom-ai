<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,">
<title>WORKROOM AI — Room</title>
<meta name="theme-color" content="#070b17">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('wr:theme'))||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="row between" style="flex-wrap:nowrap"><a href="/" class="logo"><i>W</i> WORKROOM AI</a><span data-theme-btn=""></span></div>
    <div class="menu" id="menu"></div>
    <div class="room card" style="padding:12px">
      <div class="row between"><span class="muted small">Room</span><span class="dot"></span></div>
      <b id="room-name">…</b>
      <div class="small" style="color:var(--acc2)" id="room-code"></div>
      <div class="small muted" id="me-name" style="margin-top:4px"></div>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<nav class="bottom-nav" id="bnav"></nav>
<span data-theme-btn="theme-fab"></span>

<div id="modal" class="modal-bg hidden"><div class="card modal" id="modal-body"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/face.js"></script>
<script src="/js/meeting.js"></script>
<script src="/js/offline.js"></script>
<script src="/js/app.js"></script>

</html>
